[package]
name = "chrome_lens_ocr"
version = "0.4.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bropines/chrome-lens-rs"
description = "Google Lens OCR and translation through the Chromium crupload endpoint, generated from Chromium's own protos"
rust-version = "1.90.0"
exclude = ["test.png", ".github/"]

[dependencies]
anyhow = "1.0"
log = "0.4"
prost = "0.14"
# Not only used by the client: objects_request needs it for the request uuid,
# so it cannot move behind the `client` feature.
rand = "0.9"

# jpeg because every upload is encoded as one, png because it is what a
# screenshot usually arrives as. The rest of image's default set (tiff, gif,
# exr, avif, ...) is left off so it does not unify into a consumer's build;
# `extra-formats` adds the common ones back, and a consumer that depends on
# image itself gets whatever it asks for anyway, since features unify.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

reqwest = { version = "0.12", features = ["rustls-tls", "http2"], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
env_logger = { version = "0.11", optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["client", "bin", "extra-formats"]

# `LensClient`, which owns an HTTP client and sends the request itself. Off,
# the crate still builds the request, the headers and parses the reply - which
# is all a caller with its own HTTP stack wants, and avoids linking a second
# one (reqwest pulls hyper, tokio and the TLS stack with it).
client = ["dep:reqwest", "dep:tokio"]

# The `chrome_lens_ocr` CLI and the `update-protos` tool.
bin = ["client", "dep:env_logger", "dep:serde_json", "tokio/full"]

# Decoders beyond jpeg and png, for input images.
extra-formats = ["image/webp", "image/gif", "image/bmp"]

[[bin]]
name = "chrome_lens_ocr"
path = "src/main.rs"
required-features = ["bin"]

[[bin]]
name = "update-protos"
path = "src/bin/update-protos.rs"
required-features = ["bin"]

[build-dependencies]
# prost/prost-types are used to read protoc's descriptor set and rewrite the
# `syntax` of editions files before prost-build sees it; build.rs explains why.
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
# The protos declare `edition = "2023"`/`"2024"`, which protoc below 33 cannot
# parse - and older protoc SKIPS such files rather than failing, which is how
# the checked-in modules in chrome-lens-py went stale once before. Vendoring
# protoc pins the one we compile with instead of trusting the host's.
# 3.3 bundles protoc 36.2.
protoc-bin-vendored = "3.3"
